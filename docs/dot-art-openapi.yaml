openapi: 3.0.3
info:
  title: Content Studio DOT art jobs
  version: "2.0.0"
  description: |
    Callback contract; this OpenAPI file alone is a custom-GPT Action, not an
    installed plugin or MCP bridge. See docs/dot-mcp-setup.md for the local MCP.
    Content Studio does not call OpenAI or any image model. It queues a job, and
    DOT reads the brief and sends images back into the existing post_media slots.

    Replace the server URL with the production origin before you import this file
    into a custom GPT. Authenticate with HTTP Bearer and the value of
    DOT_ART_CALLBACK_SECRET (the same secret set on Vercel Production).

    GET is read-only. POST claim obtains an exclusive 15-minute lease.
    Reuse a UUID lease_token on claim retries; renew before expiry.
    complete stores PNG, JPEG, or WebP in the private post-media bucket.
    Prefer https image URLs. base64 is only for a small image when you have no URL.
    Completion requires the full expected image set and the lease token.
    Identical completion retries return the saved result. Fail requires a lease;
    retryable failures requeue up to three total claimed attempts.
servers:
  - url: https://your-studio.vercel.app
    description: Content Studio production. Replace this host before import.
security:
  - DotBearer: []
paths:
  /api/dot/art-jobs/{id}:
    get:
      operationId: getArtJob
      summary: Read one art job
      description: |
        Returns the job, the full brief, the brand snapshot, the pack, and the
        image slots DOT should fill. Reading never claims or changes the job.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job and everything DOT needs to draw.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtJobView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/dot/art-jobs/{id}/claim:
    post:
      operationId: claimArtJob
      summary: Exclusively claim a queued or expired job
      description: |
        Reuse a client-chosen UUID lease_token on retries. Another token receives
        409 during an active lease. An expired/released token must be replaced.
        Returns the brief plus lease token, expiry, attempt count and frozen
        expected positions. Do not generate unless a lease was returned.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseRequest"
      responses:
        "200":
          description: Claimed view and lease, or terminal failed after three attempts.
        "409":
          $ref: "#/components/responses/Finished"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/dot/art-jobs/{id}/renew:
    post:
      operationId: renewArtJob
      summary: Renew an active matching lease for 15 minutes
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseRequest"
      responses:
        "200":
          description: Lease token and new expiry.
        "409":
          $ref: "#/components/responses/Finished"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/dot/art-jobs/{id}/complete:
    post:
      operationId: completeArtJob
      summary: Save images and mark the job done
      description: |
        Downloads each image and inserts post_media rows for this post.
        Send exactly the claim's expected positions, in order, in one request.
        A full carousel requires 10 slides (or all initially empty slots).
        A Post or Story accepts one image. A Reel accepts one cover.
        Partial sets and extra images are rejected; no per-image finalization.
        Repeating the same token and ordered image descriptors returns the saved
        completion result. A changed payload or stale token is rejected.
        Entire JSON request must be below 4 MB (Vercel ceiling is 4.5 MB).
        When the job was queued with replace false, only empty slots are filled.
        When replace is true, images of that kind are replaced.
        URLs must be public https. Private and local hosts are refused.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteArtJob"
      responses:
        "200":
          description: Images are on the pack and the job is done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Finished"
        "422":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/dot/art-jobs/{id}/fail:
    post:
      operationId: failArtJob
      summary: Release for bounded retry or mark the job failed
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailArtJob"
      responses:
        "200":
          description: The job is queued for retry or failed; repeat returns saved result.
          content:
            application/json:
              schema:
                type: object
                required: [ok, job_id, status]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  job_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [queued, failed]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Finished"
        "503":
          $ref: "#/components/responses/NotConfigured"
components:
  securitySchemes:
    DotBearer:
      type: http
      scheme: bearer
      description: The DOT_ART_CALLBACK_SECRET value. Send Authorization Bearer, not the secret name.
  parameters:
    JobId:
      name: id
      in: path
      required: true
      description: art_jobs.id
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: The bearer secret is missing or wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: That art job was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    BadRequest:
      description: The body or an image could not be used.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Finished:
      description: The job is finished, already claimed, or the lease/payload does not match.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotConfigured:
      description: DOT_ART_CALLBACK_SECRET or the service role key is not set on the server.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ArtJob:
      type: object
      required: [id, client_id, post_id, status, notes, replace, error, created_at, updated_at, completed_at]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, done, failed]
        notes:
          type: string
          nullable: true
          description: Optional notes the studio typed. The full brief is a separate field.
        replace:
          type: boolean
          description: True when the studio confirmed that filled slots should be replaced.
        batch_id:
          type: string
          format: uuid
          nullable: true
          description: Set when this job belongs to a Generate batch. Omit or null for a single pack.
        hold_media:
          type: boolean
          description: |
            When true, draw a full new set. Content Studio keeps the images already
            on the pack until someone accepts the new ones. Do not treat this as a
            delete. The brief says the same thing.
        error:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        completed_at:
          type: string
          nullable: true
        lease_expires_at:
          type: string
          nullable: true
        attempt_count:
          type: integer
          minimum: 0
          maximum: 3
        expected_kind:
          type: string
          nullable: true
        expected_positions:
          type: array
          nullable: true
          items:
            type: integer
        completion_result:
          type: object
          nullable: true
          description: Saved success receipt, available on done jobs.
    ArtSlots:
      type: object
      required: [format, kind, count, filled, empty, replace, empty_positions]
      properties:
        format:
          type: string
          enum: [Reel, Post, Carousel, Story]
        kind:
          type: string
          enum: [carousel, static, cover]
          description: carousel for Carousel, static for Post and Story, cover for Reel.
        count:
          type: integer
          description: 10 for a carousel. 1 for a static image or a reel cover.
        filled:
          type: integer
        empty:
          type: integer
        replace:
          type: boolean
        empty_positions:
          type: array
          items:
            type: integer
          description: Positions to fill. When replace is true this is every position of that kind.
    ArtJobView:
      type: object
      required: [job, brief, brand, post, pack_path, slots]
      properties:
        job:
          $ref: "#/components/schemas/ArtJob"
        brief:
          type: string
          description: Plain-English brief built from the brand, the pack, the notes, and the slots.
        brand:
          type: object
          description: The client brand snapshot. Text fields plus optional hex colors.
          additionalProperties: true
        post:
          type: object
          required: [title, hook, format, platform, pack]
          properties:
            title:
              type: string
            hook:
              type: string
            format:
              type: string
              enum: [Reel, Post, Carousel, Story]
            platform:
              type: string
            pack:
              type: object
              properties:
                shot_list_and_angles:
                  type: string
                caption:
                  type: string
                cta:
                  type: string
        pack_path:
          type: string
          example: /clients/harbor/packs/33333333-3333-4333-8333-333333333333
          description: Pack route on this app. It starts with /clients/{slug}/packs/{postId}.
        slots:
          $ref: "#/components/schemas/ArtSlots"
    ArtImage:
      type: object
      description: Send url, or base64 when you have no URL. If both are set, url is used.
      properties:
        url:
          type: string
          format: uri
          description: Public https URL of a PNG, JPEG, or WebP. Preferred.
        base64:
          type: string
          description: Raw base64 or a data URL. PNG, JPEG, or WebP, at most 10MB.
    LeaseRequest:
      type: object
      required: [lease_token]
      properties:
        lease_token:
          type: string
          format: uuid
    CompleteArtJob:
      type: object
      required: [lease_token, images]
      properties:
        lease_token:
          type: string
          format: uuid
        images:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/ArtImage"
    CompleteResult:
      type: object
      required: [ok, job_id, status, media]
      properties:
        ok:
          type: boolean
          enum: [true]
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [done]
        media:
          type: array
          items:
            type: object
            required: [id, kind, position]
            properties:
              id:
                type: string
                format: uuid
              kind:
                type: string
                enum: [carousel, static, cover]
              position:
                type: integer
    FailArtJob:
      type: object
      required: [lease_token, error, retryable]
      properties:
        lease_token:
          type: string
          format: uuid
        retryable:
          type: boolean
          description: True releases for retry if fewer than three attempts were claimed.
        error:
          type: string
          maxLength: 2000
          description: What went wrong, in plain language. Longer text is shortened.
